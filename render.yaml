services:
  - type: web
    name: rkts-node-api
    runtime: node
    plan: free
    buildCommand: NODE_ENV=production DATABASE_CLIENT=pg DATABASE_URL=postgres://build:build@localhost/build npm ci --only=production && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: rkts-node-api-db
          property: connectionString
      - key: PORT
        value: 3000

    # Se quiser rodar migrações automaticamente após o build:
    # buildCommand: NODE_ENV=production DATABASE_CLIENT=pg DATABASE_URL=postgres://build:build@localhost/build npm ci --only=production && npm run knex -- migrate:latest && npm run build

    # Deixe commentado se preferir rodar as migrações manualmente:
    # npm run knex -- migrate:latest

databases:
  - name: rkts-node-api-db
    plan: free

# O PostgreSQL Database será criado automaticamente
# E a DATABASE_URL será preenchida na variável de ambiente do Web Service
